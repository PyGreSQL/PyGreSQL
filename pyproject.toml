[project]
name = "PyGreSQL"
version = "6.3.0"
requires-python = ">=3.10"
authors = [
  {name = "D'Arcy J.M. Cain", email = "darcy@pygresql.org"},
  {name = "Christoph Zwerschke", email = "cito@online.de"},
]
description = "Python PostgreSQL interfaces"
readme = "README.rst"
license = "PostgreSQL"
license-files = ["LICENSE.txt"]
keywords = ["pygresql", "postgresql", "database", "api", "dbapi"]
classifiers = [
    "Development Status :: 6 - Mature",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://pygresql.github.io/"
Documentation = "https://pygresql.github.io/contents/"
"Source Code" = "https://github.com/PyGreSQL/PyGreSQL"
"Issue Tracker" = "https://github.com/PyGreSQL/PyGreSQL/issues/"
Changelog = "https://pygresql.github.io/contents/changelog.html"
Download = "https://pygresql.github.io/download/"
"Mailing List" = "https://mail.vex.net/mailman/listinfo/pygresql"

[tool.ruff]
target-version = "py310"
line-length = 79
exclude = [
    "__pycache__",
    "__pypackages__",
    ".git",
    ".tox",
    ".venv",
    ".devcontainer",
    ".vscode",
    "docs",
    "build",
    "dist",
    "local",
    "venv",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "D",   # pydocstyle
  "B",   # bugbear
  "S",   # bandit
  "SIM", # simplify
  "PGH", # pygrep-hooks
  "RUF", # ruff
]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D101", "D102", "D103", "D105", "D107", "S"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = ["ignore-without-code"]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "tests.*"
]
disallow_untyped_defs = false

[tool.coverage.run]
source = ["pg", "pgdb"]
branch = true
parallel = true

[tool.coverage.report]
fail_under = 100
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.$",
    # Windows-specific code (not measured in CI and dev container)
    "if os\\.name == .nt.:",
    "if sys\\.platform == .win32.:",
]

[tool.coverage.html]
directory = "htmlcov/python"

[tool.cibuildwheel]
# The wheels are built with .github/workflows/release.yml, from the sdist,
# against the libpq of the PostgreSQL installation that has pg_config on
# the PATH. They do not bundle libpq: pg/core.py finds libpq.dll on the PATH.
build = [
    "cp310-win_amd64",
    "cp311-win_amd64",
    "cp312-win_amd64",
    "cp313-win_amd64",
    "cp314-win_amd64",
    "cp315-win_amd64",
]
build-verbosity = 1
# treat compiler warnings as errors (see setup.py)
config-settings = {"--build-option" = ["build_ext", "--strict"]}
# run the test suite against the installed wheel, from a temporary directory
# with a copy of the tests, so that pg and pgdb are not imported from the
# source tree; needs a database server, configured like for tox
test-sources = ["tests"]
test-command = [
    "python -c \"import pg; print(pg.__file__, pg.version, pg.get_pqlib_version())\"",
    "python -X dev -W error -m unittest discover -v -s tests -t .",
]

[tool.cibuildwheel.windows]
# do not bundle libpq and its dependencies with delvewheel (the default)
repair-wheel-command = ""

[tool.setuptools]
packages = ["pg", "pgdb"]

[tool.setuptools.package-data]
pg = ["py.typed", "_pg.pyi"]
pgdb = ["py.typed"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
