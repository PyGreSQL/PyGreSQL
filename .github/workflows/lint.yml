name: Run PyGreSQL quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Quality checks run
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Setup Python 3.15
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install libpq
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev
      - name: Install tox
        run: pip install tox
      - name: Run quality checks
        run: tox -e ruff,mypy,stubtest,cformat,docs
        timeout-minutes: 5
