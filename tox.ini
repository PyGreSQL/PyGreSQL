# config file for tox

[tox]
envlist = py3{10,11,12,13,14,15},ruff,mypy,cformat,docs
# Thorough local test in the dev container with `tox -m thorough` (do not
# run it in parallel, since all envs build the extension into the same dir):
# all server versions with UTF8, all other encodings with the newest server,
# and SQL_ASCII also with the oldest Python and server.
labels =
    thorough = py315-pg1{2,3,4,5,6,7,8}, py315-pg19-{ascii,latin1,latin9,cyrillic}, py310-pg12-ascii

[testenv:ruff]
basepython = python3.15
deps =
    ruff>=0.17,<0.18
commands =
    ruff check setup.py pg pgdb tests
commands_pre =

[testenv:mypy]
basepython = python3.15
deps =
    mypy>=2.4,<2.5
commands =
    mypy pg pgdb tests
commands_pre =

[testenv:cformat]
basepython = python3.15
allowlist_externals =
    sh
commands =
    sh -c "clang-format --style=file --dry-run --Werror ext/*.c"
commands_pre =

[testenv:docs]
basepython = python3.15
deps =
    sphinx>=9,<10
commands =
    sphinx-build -b html -nEW docs docs/_build/html
commands_pre =

[testenv:build]
basepython = python3.15
deps =
    setuptools>=77
    build>=1.3,<2
commands =
    python -m build -s -n
commands_pre =

[testenv:coverage]
basepython = python3.15
deps =
    coverage>=7,<8
commands =
    coverage run -m unittest discover -v
    coverage html

[testenv]
passenv =
    PG*
    PYGRESQL_*
# Optional factors for local testing in the dev container (not used in CI):
# pg12 to pg19 select the server, ascii, latin1, latin9 and cyrillic select
# a database with that encoding (default: UTF8), e.g. tox -e py315-pg12-ascii
setenv =
    pg12: PGHOST=pg12
    pg12: PYGRESQL_HOST=pg12
    pg13: PGHOST=pg13
    pg13: PYGRESQL_HOST=pg13
    pg14: PGHOST=pg14
    pg14: PYGRESQL_HOST=pg14
    pg15: PGHOST=pg15
    pg15: PYGRESQL_HOST=pg15
    pg16: PGHOST=pg16
    pg16: PYGRESQL_HOST=pg16
    pg17: PGHOST=pg17
    pg17: PYGRESQL_HOST=pg17
    pg18: PGHOST=pg18
    pg18: PYGRESQL_HOST=pg18
    pg19: PGHOST=pg19
    pg19: PYGRESQL_HOST=pg19
    ascii: PGDATABASE=test_ascii
    ascii: PYGRESQL_DB=test_ascii
    latin1: PGDATABASE=test_latin1
    latin1: PYGRESQL_DB=test_latin1
    latin9: PGDATABASE=test_latin9
    latin9: PYGRESQL_DB=test_latin9
    cyrillic: PGDATABASE=test_cyrillic
    cyrillic: PYGRESQL_DB=test_cyrillic
deps =
    setuptools>=77
commands =
    python -m unittest {posargs:discover -v}
commands_pre =
    python setup.py clean --all build_ext --force --inplace --strict --pedantic --memory-size
