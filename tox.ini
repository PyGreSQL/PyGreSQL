# config file for tox

[tox]
# the default envs: tests with all Python versions and all checks
envlist = py3{10,11,12,13,14,15},ruff,mypy,stubtest,analyze,cformat,docs
# Thorough local test in the dev container with `tox -m thorough` (do not
# run it in parallel, since all envs build the extension into the same dir):
# all server versions with UTF8, all other encodings with the newest server,
# and SQL_ASCII also with the oldest Python and server.
labels =
    thorough = py315-pg1{2,3,4,5,6,7,8}, py315-pg19-{ascii,latin1,latin9,cyrillic}, py310-pg12-ascii

[testenv:ruff]
# lint the Python code
basepython = python3.15
deps =
    ruff>=0.17,<0.18
commands =
    ruff check setup.py pg pgdb tests
commands_pre =

[testenv:mypy]
# type check the Python code
basepython = python3.15
deps =
    mypy>=2.4,<2.5
commands =
    mypy pg pgdb tests
commands_pre =

[testenv:stubtest]
# check pg/_pg.pyi against the C extension, which is built in place
basepython = python3.15
skip_install = true
deps =
    setuptools>=77
    mypy>=2.4,<2.5
commands_pre =
    python setup.py clean --all build_ext --force --inplace --strict --pedantic --memory-size
commands =
    python -m mypy.stubtest pg._pg --allowlist stubtest_allowlist.txt

[testenv:analyze]
# run the static analyzer of gcc on the C extension, warnings are errors
# (built into a temporary dir, so that the in-place build is not touched)
basepython = python3.15
skip_install = true
deps =
    setuptools>=77
commands_pre =
commands =
    python setup.py build_ext --force --strict --pedantic --analyze --memory-size --build-lib {envtmpdir}/lib --build-temp {envtmpdir}/build

[testenv:cformat]
# check the formatting of the C code (needs clang-format >= 17)
basepython = python3.15
allowlist_externals =
    sh
commands =
    sh -c "clang-format --style=file --dry-run --Werror ext/*.c"
commands_pre =

[testenv:docs]
# build the docs, warnings and broken references are errors
basepython = python3.15
deps =
    sphinx>=9,<10
commands =
    sphinx-build -b html -nEW docs docs/_build/html
commands_pre =

[testenv:build]
# build the source distribution
basepython = python3.15
deps =
    setuptools>=77
    build>=1.3,<2
commands =
    python -m build -s -n
commands_pre =

[testenv:coverage]
# run the tests like the test envs with coverage measurement of the Python
# code, create the HTML report in htmlcov/python, then fail if the coverage
# is below the minimum
basepython = python3.15
deps =
    setuptools>=77
    coverage>=7.17,<8
commands_pre =
    python setup.py clean --all build_ext --force --inplace --strict --pedantic --memory-size
    coverage erase
commands =
    python -X dev -W error -m coverage run -m unittest {posargs:discover -v}
    coverage combine
    coverage html
    coverage report -m

[testenv]
# run the tests with the C extension built in place (strict, pedantic)
passenv =
    PG*
    PYGRESQL_*
# Optional factors for local testing in the dev container (not used in CI):
# pg12 to pg19 select the server, ascii, latin1, latin9 and cyrillic select
# a database with that encoding (default: UTF8), e.g. tox -e py315-pg12-ascii
setenv =
    # abort the test run if it takes longer (see tests/__init__.py)
    PYGRESQL_TEST_TIMEOUT={env:PYGRESQL_TEST_TIMEOUT:120}
    pg12: PGHOST=pg12
    pg12: PYGRESQL_HOST=pg12
    pg13: PGHOST=pg13
    pg13: PYGRESQL_HOST=pg13
    pg14: PGHOST=pg14
    pg14: PYGRESQL_HOST=pg14
    pg15: PGHOST=pg15
    pg15: PYGRESQL_HOST=pg15
    pg16: PGHOST=pg16
    pg16: PYGRESQL_HOST=pg16
    pg17: PGHOST=pg17
    pg17: PYGRESQL_HOST=pg17
    pg18: PGHOST=pg18
    pg18: PYGRESQL_HOST=pg18
    pg19: PGHOST=pg19
    pg19: PYGRESQL_HOST=pg19
    ascii: PGDATABASE=test_ascii
    ascii: PYGRESQL_DB=test_ascii
    latin1: PGDATABASE=test_latin1
    latin1: PYGRESQL_DB=test_latin1
    latin9: PGDATABASE=test_latin9
    latin9: PYGRESQL_DB=test_latin9
    cyrillic: PGDATABASE=test_cyrillic
    cyrillic: PYGRESQL_DB=test_cyrillic
deps =
    setuptools>=77
# run the tests in Python Development Mode with warnings turned into errors,
# and show the slowest tests (the --durations option needs Python 3.12)
commands =
    py310,py311: python -X dev -W error -m unittest {posargs:discover -v}
    !py310-!py311: python -X dev -W error -m unittest {posargs:discover -v} --durations 5
commands_pre =
    python setup.py clean --all build_ext --force --inplace --strict --pedantic --memory-size
